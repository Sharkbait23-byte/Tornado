<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit por Bit - Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/static/img/owl.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/studentdash.css">
    <script src="/static/js/courses.js" defer></script>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-code"></i> Bit por Bit
        </div>
        <a href="#" class="menu-item active" data-section="mis-cursos">
            <i class="fas fa-book"></i> Mis Cursos
        </a>
        <a href="#" class="menu-item" data-section="mis-certificados">
            <i class="fa-solid fa-graduation-cap"></i> Mis Certificados
        </a>
        <a href="#" class="menu-item" data-section="documentacion">
            <i class="fa-solid fa-book-open-reader"></i> Documentación
        </a>
        <a href="#" class="menu-item" data-section="mi-perfil">
            <i class="fa-solid fa-user"></i> Perfil
        </a>
    </aside>
    
    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="header-title">
                <i class="fas fa-book"></i> Mis Cursos
            </div>
            <div class="user-profile" id="user-profile">
                <span>{{user}}</span>
                <div class="avatar">U</div>
                <!-- User Dropdown Menu -->
                <div class="user-dropdown" id="user-dropdown">
                    <a href="#" class="user-dropdown-item" id="profile-link">
                        <i class="fas fa-user-circle"></i> Mi Perfil
                    </a>
                    <a href="#" class="user-dropdown-item" id="settings-link">
                        <i class="fas fa-cog"></i> Ajustes
                    </a>
                    <a href="#" class="user-dropdown-item logout" id="logout-link">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </a>
                </div>
            </div>
        </header>
        
        <!-- Content Container -->
        <div class="content-container" id="content-area">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    
    <script src="/static/js/studentdash.js"></script>
</body>
</html>
