<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit por Bit - Inicio de Sesión</title>
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="icon" type="image/x-icon" href="/static/img/owl.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-container">
        <div class="login-container">
            <div class="login-branding">
                <div class="logo-container">
                    <div class="logo">
                        <span class="code-tag">&lt;/&gt;</span>
                        <h1>Bit por Bit</h1>
                    </div>
                </div>
                <div class="illustration">
                    <img src="/static/img/login.jpg" alt="Ilustración de inicio de sesión">
                </div>
            </div>
            
            <div class="login-content">
                <div class="login-header">
                    <h2>Inicio de Sesión</h2>
                    <p class="login-subtitle">Ingresa tus credenciales para continuar</p>
                </div>
                
                <form id="login-form" method="post">
                    <div class="form-group">
                        <label for="email">Correo</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="matricula@univermilenium.edu.mx" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                            <button type="button" id="toggle-password" class="toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="login-btn">
                        <span>Iniciar Sesión</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
                
                <div class="help-text">
                    <i class="fas fa-info-circle"></i>
                    <p>Recuerda que si olvidaste tu contraseña o tienes problemas ingresando, debes contactar a tu escuela</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast container -->
    <div id="toast-container"></div>
    
    <script src="/static/js/login.js"></script>
</body>
</html>
