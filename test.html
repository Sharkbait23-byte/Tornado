<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Cursos</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/css/test.css">
</head>
<body>
    <div class="container">
        <h2>
            <span class="icon">📚</span>
            Cursos en progreso
        </h2>
        
        <div class="courses-container" id="ongoing-courses">
            <!-- Courses in progress will be loaded here -->
        </div>
        
        <h2>
            <span class="icon">⭐</span>
            Cursos disponibles
        </h2>
        
        <div class="courses-container" id="available-courses">
            <!-- Available courses will be loaded here -->
        </div>
    </div>

    <!-- Custom script -->
    <script src="/static/js/test.js"></script>
</body>
</html>
